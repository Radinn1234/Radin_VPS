name: Test Python Website

on:
  workflow_dispatch:

jobs:
  run-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flask
        run: pip install flask

      - name: Run site in background
        run: python app.py &

      - name: Wait for server to start
        run: sleep 3

      - name: Test the site
        run: curl http://localhost:5000
