name: Windows 11 KVM VM

on:
  workflow_dispatch:

jobs:
  windows-vm:

    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

    # ==========================
    # Install KVM/QEMU
    # ==========================
    - name: Install KVM packages
      run: |
        sudo apt update

        sudo apt install -y \
          qemu-kvm \
          qemu-system-x86 \
          qemu-utils \
          ovmf \
          swtpm \
          tmux \
          wget

        kvm-ok || true


    # ==========================
    # Install Tailscale
    # ==========================
    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

        sudo systemctl enable --now tailscaled


    # ==========================
    # Connect Tailscale
    # ==========================
    - name: Connect Tailscale
      env:
        TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      run: |

        sudo tailscale up \
          --auth-key="$TS_AUTHKEY" \
          --hostname="windows-vm-${GITHUB_RUN_ID}"

        echo "Tailscale IP:"
        sudo tailscale ip -4


    # ==========================
    # Download Windows ISO
    # ==========================
    - name: Download Windows 11 ISO
      run: |

        wget -O Windows11.iso \
        "https://mirror.hep.gg/ISO/Windows/11/Win11_25H2_EnglishInternational_x64_v2.iso"

        file Windows11.iso


    # ==========================
    # Create VM disk
    # ==========================
    - name: Create VM disk
      run: |

        qemu-img create \
        -f qcow2 \
        win11.qcow2 \
        80G


    # ==========================
    # TPM 2.0
    # ==========================
    - name: Start TPM
      run: |

        mkdir -p /tmp/win11-tpm

        sudo swtpm socket \
          --tpm2 \
          --tpmstate dir=/tmp/win11-tpm \
          --ctrl type=unixio,path=/tmp/win11-tpm/swtpm.sock \
          --daemon


    # ==========================
    # Start VM
    # ==========================
    - name: Start Windows VM
      run: |

        tmux new-session -d -s win11 '

        sudo qemu-system-x86_64 \
          -enable-kvm \
          -machine q35,smm=on \
          -cpu host \
          -smp 3 \
          -m 8192 \
          -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
          -drive if=pflash,format=raw,file=/usr/share/OVMF/OVMF_VARS_4M.fd \
          -drive file=win11.qcow2,format=qcow2 \
          -cdrom Windows11.iso \
          -boot d \
          -chardev socket,id=chrtpm,path=/tmp/win11-tpm/swtpm.sock \
          -tpmdev emulator,id=tpm0,chardev=chrtpm \
          -device tpm-tis,tpmdev=tpm0 \
          -spice addr=0.0.0.0,port=5900,disable-ticketing=on \
          -vga qxl

        '


    # ==========================
    # Info
    # ==========================
    - name: Show Connection
      run: |

        echo "=============================="

        IP=$(sudo tailscale ip -4)

        echo "Windows VM is running"
        echo ""
        echo "SPICE:"
        echo "spice://$IP:5900"

        echo "=============================="


    # ==========================
    # Keep Alive
    # ==========================
    - name: Keep Alive
      run: |

        while true
        do
          echo "[$(date)] Windows VM alive"
          sleep 300
        done
