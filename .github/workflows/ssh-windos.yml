name: Windows RDP + Tailscale + OpenSSH

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "runneradmin" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
              Write-Host "Creating runneradmin..."

              New-LocalUser `
                -Name "runneradmin" `
                -Password $password `
                -FullName "RDP Administrator" `
                -Description "Temporary RDP/SSH user"
          }
          else {
              Write-Host "runneradmin already exists."
              Write-Host "Updating password..."

              Set-LocalUser `
                -Name "runneradmin" `
                -Password $password
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "runneradmin" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService"

          Write-Host "RDP enabled successfully."


      - name: Enable OpenSSH Server
        shell: powershell
        run: |
          Write-Host "Installing OpenSSH Server..."

          $sshCapability = Get-WindowsCapability `
            -Online `
            -Name OpenSSH.Server~~~~0.0.1.0

          if ($sshCapability.State -ne "Installed") {
              Add-WindowsCapability `
                -Online `
                -Name OpenSSH.Server~~~~0.0.1.0
          }

          Start-Service sshd

          Set-Service `
            -Name sshd `
            -StartupType Automatic

          $sshdConfig = "C:\ProgramData\ssh\sshd_config"

          if (Test-Path $sshdConfig) {

              $config = Get-Content $sshdConfig

              $config = $config `
                -replace '^\s*#?\s*PasswordAuthentication\s+.*$', 'PasswordAuthentication yes'

              if ($config -notmatch '^\s*PasswordAuthentication\s+yes') {
                  Add-Content `
                    -Path $sshdConfig `
                    -Value "`r`nPasswordAuthentication yes"
              }

              Set-Content `
                -Path $sshdConfig `
                -Value $config
          }

          Restart-Service sshd

          if (-not (Get-NetFirewallRule `
              -Name "OpenSSH-Server-In-TCP" `
              -ErrorAction SilentlyContinue)) {

              New-NetFirewallRule `
                -Name "OpenSSH-Server-In-TCP" `
                -DisplayName "OpenSSH Server (sshd)" `
                -Enabled True `
                -Direction Inbound `
                -Protocol TCP `
                -Action Allow `
                -LocalPort 22
          }
          else {
              Enable-NetFirewallRule `
                -Name "OpenSSH-Server-In-TCP"
          }

          Write-Host "OpenSSH Server is ready."


      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "Installing Tailscale..."

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          Write-Host "Tailscale installed."


      - name: Connect Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          Write-Host "Connecting to Tailscale..."

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $tailscale up `
            --authkey="$env:TS_AUTHKEY" `
            --hostname="github-windows-rdp"

          Write-Host "Tailscale connected."


      - name: Get Tailscale IP
        shell: powershell
        run: |
          Start-Sleep -Seconds 5

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $ip = & $tailscale ip -4

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       WINDOWS SERVER IS READY"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $ip

          Write-Host ""
          Write-Host "RDP Address:"
          Write-Host "$ip`:3389"

          Write-Host ""
          Write-Host "SSH Address:"
          Write-Host "$ip`:22"

          Write-Host ""
          Write-Host "Username:"
          Write-Host "runneradmin"

          Write-Host ""
          Write-Host "Password:"
          Write-Host "The value stored in RDP_PASSWORD"

          Write-Host ""
          Write-Host "========================================"


      - name: Check RDP and SSH
        shell: powershell
        run: |
          Write-Host "Checking RDP service..."
          Get-Service TermService

          Write-Host ""
          Write-Host "Checking port 3389..."

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Checking OpenSSH service..."
          Get-Service sshd

          Write-Host ""
          Write-Host "Checking port 22..."

          Get-NetTCPConnection `
            -LocalPort 22 `
            -ErrorAction SilentlyContinue


      - name: Keep runner alive
        shell: powershell
        run: |
          Write-Host "Windows RDP + SSH runner is running."

          while ($true) {

            $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

            Write-Host ""
            Write-Host "===== Tailscale Status ====="

            & $tailscale status

            Write-Host ""
            Write-Host "===== Services ====="

            Get-Service TermService, sshd |
              Format-Table -AutoSize

            Write-Host ""
            Write-Host "RDP: 3389"
            Write-Host "SSH:  22"

            Write-Host ""
            Write-Host "Runner is still running..."

            Start-Sleep -Seconds 60
          }
