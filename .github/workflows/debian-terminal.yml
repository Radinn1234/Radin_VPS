name: Debian 11 Terminal

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: ubuntu-latest

    container:
      image: debian:bullseye

    timeout-minutes: 60

    steps:
      - name: Setup tmate
        run: |
          set -eux

          echo "=== OS ==="
          cat /etc/os-release

          echo "=== Installing tmate ==="
          apt-get update
          apt-get install -y tmate

          echo "=== Starting tmate ==="
          tmate -S /tmp/tmate.sock new-session -d

          tmate -S /tmp/tmate.sock wait tmate-ready

          echo
          echo "======================================"
          echo "TMATE SSH CONNECTION:"
          echo "======================================"
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo "======================================"

          echo
          echo "Debian 11 terminal is running..."
          sleep 1h
