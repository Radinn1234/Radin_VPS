name: Debian 11 Terminal

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Start Debian 11
        run: |
          docker pull debian:bullseye

          docker run -d \
            --name debian11 \
            --hostname debian11 \
            debian:bullseye \
            tail -f /dev/null

          docker ps

      - name: Install tmate
        run: |
          sudo apt-get update
          sudo apt-get install -y tmate

      - name: Start tmate
        run: |
          echo "Starting tmate..."

          tmate -S /tmp/tmate.sock new-session -d

          sleep 5

          echo ""
          echo "=============================="
          echo "TMATE:"
          echo "=============================="

          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'

          echo ""
          echo "=============================="
          echo "WEB:"
          echo "=============================="

          tmate -S /tmp/tmate.sock display -p '#{tmate_web}'

          echo ""
          echo "=============================="
          echo "Debian command:"
          echo "docker exec -it debian11 bash"
          echo "=============================="

          sleep 1h
