name: Debian Terminal

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: ubuntu-latest

    container:
      image: debian:bullseye

    timeout-minutes: 65

    steps:
      - name: System Info
        run: |
          echo "=== USER ==="
          whoami
          id

          echo
          echo "=== OS ==="
          cat /etc/os-release

          echo
          echo "=== HOST ==="
          hostname

      - name: Open Terminal
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Keep Runner Alive
        run: |
          echo "Terminal session should remain available."
          echo "Keeping the job alive for 1 hour..."
          sleep 3600
