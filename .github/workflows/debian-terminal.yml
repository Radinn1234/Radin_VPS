name: Debian Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye

    timeout-minutes: 30

    steps:
      - name: System info
        run: |
          echo "User:"
          whoami
          echo
          echo "OS:"
          cat /etc/os-release
          echo
          echo "Kernel:"
          uname -a

      - name: Debug terminal
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
