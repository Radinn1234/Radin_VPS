name: Debian 11 Terminal

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Create Debian 11 container
        run: |
          docker pull debian:bullseye

          docker run -d \
            --name debian11 \
            --hostname debian11 \
            debian:bullseye \
            tail -f /dev/null

          echo "================================="
          echo "Debian 11 container started"
          echo "================================="

          docker ps

      - name: Open terminal
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
