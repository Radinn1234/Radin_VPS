name: Debian Terminal

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: ubuntu-latest

    container:
      image: debian:bullseye

    timeout-minutes: 65

    steps:
      - name: System Info
        run: |
          echo "=== SYSTEM ==="
          cat /etc/os-release

          echo
          echo "=== USER ==="
          whoami
          id

          echo
          echo "=== HOST ==="
          hostname

      - name: Install basic tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            openssh-client

          echo "=== INSTALLATION COMPLETE ==="

      - name: Open Terminal
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Keep Alive
        run: |
          echo "Keeping runner alive for 1 hour..."
          sleep 3600
