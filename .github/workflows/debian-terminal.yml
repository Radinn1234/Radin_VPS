name: Debian 11 - Tmate Terminal

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Start Debian 11 container
        run: |
          set -e

          echo "=== Starting Debian 11 container ==="

          docker pull debian:bullseye

          docker run -d \
            --name debian11 \
            --hostname debian11 \
            debian:bullseye \
            tail -f /dev/null

          echo "Container started:"
          docker ps

      - name: Install tmate on runner
        run: |
          set -e

          echo "=== Installing tmate on Ubuntu runner ==="

          sudo apt-get update
          sudo apt-get install -y tmate

      - name: Start tmate
        run: |
          set -e

          echo "=== Starting tmate ==="

          tmate new-session -d

          echo "=== Waiting for tmate connection ==="

          for i in $(seq 1 30); do
            SSH_CMD=$(tmate display -p '#{tmate_ssh}' 2>/dev/null || true)

            if [ -n "$SSH_CMD" ] && [ "$SSH_CMD" != "undefined" ]; then
              echo ""
              echo "=============================================="
              echo " TMATE SSH CONNECTION"
              echo "=============================================="
              echo "$SSH_CMD"
              echo "=============================================="
              echo ""
              break
            fi

            sleep 2
          done

          echo "Runner is ready."

      - name: Keep runner alive
        run: |
          echo "=============================================="
          echo " Connected terminal:"
          echo "   Ubuntu GitHub Runner"
          echo ""
          echo " Debian 11 container:"
          echo "   docker exec -it debian11 bash"
          echo "=============================================="

          sleep 1h
