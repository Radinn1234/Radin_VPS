
name: Android 17 Cloud Phone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify openjdk-17-jdk

      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/emulator" >> "$GITHUB_PATH"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip -O /tmp/cmdline.zip
          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools/* "$HOME/android-sdk/cmdline-tools/latest/"

          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "emulator" "system-images;android-37;google_apis;x86_64"

      - name: Create Android 17 emulator
        run: |
          echo "no" | avdmanager create avd \
            -n CloudPhone \
            -k "system-images;android-37;google_apis;x86_64" \
            -d pixel_6

      - name: Start display
        run: |
          Xvfb :0 -screen 0 1080x1920x24 &
          sleep 3

      - name: Start Android
        run: |
          emulator -avd CloudPhone \
            -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot > /tmp/emulator.log 2>&1 &

          adb wait-for-device
          timeout 300 bash -c \
            'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Start VNC
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASSWORD" ]; then
            echo "VNC_PASSWORD secret is missing"
            exit 1
          fi

          x11vnc -display :0 -forever -shared \
            -rfbport 5900 -passwd "$VNC_PASSWORD" \
            -noxdamage -bg

          websockify --web=/usr/share/novnc/ \
            6080 localhost:5900 > /tmp/websockify.log 2>&1 &

      - name: Show connection address
        run: |
          IP=$(tailscale ip -4)
          echo "## Android 17 Cloud Phone" >> "$GITHUB_STEP_SUMMARY"
          echo "Open this address while connected to Tailscale:" >> "$GITHUB_STEP_SUMMARY"
          echo "http://$IP:6080/vnc.html?autoconnect=true" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Android running
        run: sleep 21000
