
name: Android 17 Cloud Phone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb x11vnc novnc websockify \
            openjdk-17-jdk wget unzip curl

      - name: Install Android SDK
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -O cmdline.zip

          unzip -q cmdline.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "emulator" \
            "system-images;android-37.0;google_apis_ps16k;x86_64"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Create Android 17 device
        run: |
          echo "no" | avdmanager create avd \
            -n CloudPhone \
            -k "system-images;android-37.0;google_apis_ps16k;x86_64" \
            -d pixel_6

      - name: Start virtual display
        run: |
          Xvfb :0 -screen 0 1080x1920x24 &
          echo "DISPLAY=:0" >> "$GITHUB_ENV"
          sleep 3

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Start VNC before Android
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -e

          if [ -z "$VNC_PASSWORD" ]; then
            echo "VNC_PASSWORD secret is missing!"
            exit 1
          fi

          IP=$(tailscale ip -4)
          echo "Tailscale IP: $IP"

          x11vnc \
            -display :0 \
            -localhost \
            -forever \
            -shared \
            -rfbport 5900 \
            -passwd "$VNC_PASSWORD" \
            -noxdamage \
            -bg

          sleep 2

          websockify \
            --web=/usr/share/novnc/ \
            --host=0.0.0.0 \
            6080 127.0.0.1:5900 \
            > /tmp/websockify.log 2>&1 &

          echo $! > /tmp/websockify.pid

          sleep 5

          echo "===== WEBSOCKIFY LOG ====="
          cat /tmp/websockify.log || true

          echo "===== PROCESSES ====="
          ps aux | grep -E 'websockify|x11vnc' || true

          echo "===== PORT 6080 ====="
          sudo ss -lntp | grep 6080 || true

          echo "===== LOCAL VNC TEST ====="
          curl -v --max-time 10 \
            http://127.0.0.1:6080/vnc.html \
            -o /dev/null

          echo "===== TAILSCALE VNC TEST ====="
          curl -v --max-time 10 \
            "http://$IP:6080/vnc.html" \
            -o /dev/null

          echo "## Android 17 Cloud Phone" >> "$GITHUB_STEP_SUMMARY"
          echo "VNC server is running!" >> "$GITHUB_STEP_SUMMARY"
          echo "http://$IP:6080/vnc.html?autoconnect=true" >> "$GITHUB_STEP_SUMMARY"

          echo "VNC is ready!"

      - name: Start Android Emulator
        run: |
          set +e

          nohup emulator -avd CloudPhone \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader \
            -accel auto \
            > /tmp/emulator.log 2>&1 &

          echo "Waiting for Android device..."

          if ! timeout 180 adb wait-for-device; then
            echo "ADB could not detect the emulator!"
            echo "===== EMULATOR LOG ====="
            cat /tmp/emulator.log
            echo "===== ADB DEVICES ====="
            adb devices -l
            exit 1
          fi

          echo "Device detected. Waiting for Android boot..."

          if ! timeout 420 bash -c '
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do
              sleep 5
            done
          '; then
            echo "Android boot timed out!"
            echo "===== EMULATOR LOG ====="
            cat /tmp/emulator.log
            exit 1
          fi

          echo "Android 17 booted successfully!"

      - name: Keep VNC alive
        if: always()
        run: |
          echo "Keeping session alive for debugging..."
          sleep 20000
