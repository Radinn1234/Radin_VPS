name: Windows RDP + WireGuard + Tailscale

on:
workflow_dispatch:

jobs:
rdp:
runs-on: windows-2025
timeout-minutes: 360

steps:
  - name: Enable RDP
    shell: powershell
    env:
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
    run: |
      Write-Host "Enabling Remote Desktop..."

      Set-ItemProperty `
        -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
        -Name "fDenyTSConnections" `
        -Value 0

      Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      $password = ConvertTo-SecureString `
        $env:RDP_PASSWORD `
        -AsPlainText `
        -Force

      $user = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue

      if ($null -eq $user) {
          New-LocalUser `
            -Name "runneradmin" `
            -Password $password `
            -FullName "RDP Administrator" `
            -Description "Temporary RDP user"
      }
      else {
          Set-LocalUser `
            -Name "runneradmin" `
            -Password $password
      }

      Add-LocalGroupMember `
        -Group "Administrators" `
        -Member "runneradmin" `
        -ErrorAction SilentlyContinue

      Set-Service -Name "TermService" -StartupType Automatic
      Start-Service -Name "TermService"

      Write-Host "RDP enabled successfully."

  - name: Install WireGuard
    shell: powershell
    run: |
      Write-Host "Downloading WireGuard..."

      $url = "https://download.wireguard.com/windows-client/wireguard-amd64-1.1.1.msi"
      $installer = "$env:TEMP\wireguard.msi"

      Invoke-WebRequest `
        -Uri $url `
        -OutFile $installer

      Write-Host "Installing WireGuard..."

      Start-Process `
        -FilePath "msiexec.exe" `
        -ArgumentList "/i `"$installer`" /qn /norestart" `
        -Wait

      Write-Host "WireGuard installed."

  - name: Configure WireGuard
    shell: powershell
    env:
      WG_CONFIG: ${{ secrets.WG_CONFIG }}
    run: |
      Write-Host "Creating WireGuard configuration..."

      $configPath = "C:\Program Files\WireGuard\Data\Configurations\rdp.conf"

      New-Item `
        -ItemType Directory `
        -Path "C:\Program Files\WireGuard\Data\Configurations" `
        -Force | Out-Null

      [System.IO.File]::WriteAllText(
        $configPath,
        $env:WG_CONFIG,
        [System.Text.UTF8Encoding]::new($false)
      )

      Write-Host "WireGuard configuration created."

  - name: Connect WireGuard
    shell: powershell
    run: |
      Write-Host "Connecting WireGuard..."

      $wg = "C:\Program Files\WireGuard\wireguard.exe"

      & $wg /installtunnelservice `
        "C:\Program Files\WireGuard\Data\Configurations\rdp.conf"

      Start-Sleep -Seconds 8

      Write-Host ""
      Write-Host "===== WireGuard Status ====="

      Get-Service | Where-Object {
        $_.Name -like "WireGuardTunnel*" -or
        $_.DisplayName -like "*WireGuard*"
      } | Format-Table Name, Status

      Write-Host ""
      Write-Host "Testing WireGuard server..."

      ping.exe -n 4 172.31.250.1

  - name: Check WireGuard network
    shell: powershell
    run: |
      Write-Host "===== Network Configuration ====="
      Get-NetIPConfiguration | Format-Table InterfaceAlias, IPv4Address, IPv4DefaultGateway

      Write-Host ""
      Write-Host "===== Route to WireGuard server ====="
      Get-NetRoute -DestinationPrefix "172.31.250.1/32" -ErrorAction SilentlyContinue

  - name: Install Tailscale
    shell: powershell
    run: |
      Write-Host "Installing Tailscale..."

      $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
      $installer = "$env:TEMP\tailscale.msi"

      Invoke-WebRequest `
        -Uri $url `
        -OutFile $installer

      Start-Process `
        -FilePath "msiexec.exe" `
        -ArgumentList "/i `"$installer`" /quiet /norestart" `
        -Wait

      Write-Host "Tailscale installed."

  - name: Connect Tailscale
    shell: powershell
    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
    run: |
      Write-Host "Connecting to Tailscale..."

      $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

      & $tailscale up `
        --authkey="$env:TS_AUTHKEY" `
        --hostname="github-windows-rdp"

      Write-Host "Tailscale connected."

  - name: Get Tailscale IP
    shell: powershell
    run: |
      Start-Sleep -Seconds 5

      $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
      $ip = & $tailscale ip -4

      Write-Host ""
      Write-Host "========================================"
      Write-Host "       WINDOWS RDP IS READY"
      Write-Host "========================================"
      Write-Host ""
      Write-Host "WireGuard:"
      Write-Host "Connected to 172.31.250.1"
      Write-Host ""
      Write-Host "Tailscale IP:"
      Write-Host $ip
      Write-Host ""
      Write-Host "RDP Address:"
      Write-Host "$ip`:3389"
      Write-Host ""
      Write-Host "Username:"
      Write-Host "runneradmin"
      Write-Host ""
      Write-Host "Password:"
      Write-Host "The value stored in RDP_PASSWORD"
      Write-Host ""
      Write-Host "========================================"

  - name: Check RDP
    shell: powershell
    run: |
      Write-Host "Checking RDP service..."

      Get-Service TermService

      Write-Host ""
      Write-Host "Checking port 3389..."

      Get-NetTCPConnection `
        -LocalPort 3389 `
        -ErrorAction SilentlyContinue

  - name: Keep runner alive
    shell: powershell
    run: |
      Write-Host "Windows RDP runner is running."

      while ($true) {
        $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

        Write-Host ""
        Write-Host "===== Tailscale Status ====="
        & $tailscale status

        Write-Host ""
        Write-Host "===== WireGuard Status ====="

        Get-Service | Where-Object {
          $_.Name -like "WireGuardTunnel*"
        } | Format-Table Name, Status

        Write-Host ""
        Write-Host "RDP is still running..."

        Start-Sleep -Seconds 60
      }
