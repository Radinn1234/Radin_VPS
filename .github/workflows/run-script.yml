name: Run Shell Script on Debian

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    container: debian:bullseye
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show OS info
        run: cat /etc/os-release

      - name: Run the script
        run: |
          chmod +x script.sh
          ./script.sh
