name: WireGuard + Tailscale

on:
  workflow_dispatch:

jobs:
  wireguard:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Install packages
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            wireguard \
            qrencode \
            iptables \
            curl \
            python3

      # ==========================================
      # Tailscale
      # ==========================================

      - name: Install and connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -e

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --auth-key="$TS_AUTHKEY"

          echo "======================================"
          echo "TAILSCALE"
          echo "======================================"

          tailscale ip -4
          tailscale status

      # ==========================================
      # Create WireGuard
      # ==========================================

      - name: Create WireGuard server
        shell: bash
        run: |
          set -e

          WORKDIR="$GITHUB_WORKSPACE/wireguard"

          mkdir -p "$WORKDIR"

          # --------------------------------------
          # Generate server keys
          # --------------------------------------

          wg genkey > "$WORKDIR/server_private.key"

          wg pubkey \
            < "$WORKDIR/server_private.key" \
            > "$WORKDIR/server_public.key"

          # --------------------------------------
          # Generate client keys
          # --------------------------------------

          wg genkey > "$WORKDIR/client_private.key"

          wg pubkey \
            < "$WORKDIR/client_private.key" \
            > "$WORKDIR/client_public.key"

          chmod 600 "$WORKDIR"/*.key

          SERVER_PRIVATE=$(cat "$WORKDIR/server_private.key")
          SERVER_PUBLIC=$(cat "$WORKDIR/server_public.key")

          CLIENT_PRIVATE=$(cat "$WORKDIR/client_private.key")
          CLIENT_PUBLIC=$(cat "$WORKDIR/client_public.key")

          # --------------------------------------
          # Detect interface
          # --------------------------------------

          WAN_IF=$(ip route show default | awk '/default/ {print $5; exit}')

          if [ -z "$WAN_IF" ]; then
            echo "Could not detect network interface."
            exit 1
          fi

          echo "WAN interface: $WAN_IF"

          # --------------------------------------
          # Tailscale IP
          # --------------------------------------

          TS_IP=$(tailscale ip -4)

          if [ -z "$TS_IP" ]; then
            echo "Could not get Tailscale IP."
            exit 1
          fi

          echo "Tailscale IP: $TS_IP"

          # --------------------------------------
          # Enable IPv4 forwarding
          # --------------------------------------

          sudo sysctl -w net.ipv4.ip_forward=1

          # --------------------------------------
          # WireGuard config
          # --------------------------------------

          sudo mkdir -p /etc/wireguard

          sudo tee /etc/wireguard/wg0.conf > /dev/null <<EOF
          [Interface]
          Address = 10.66.66.1/24
          ListenPort = 51820
          PrivateKey = $SERVER_PRIVATE

          PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o $WAN_IF -j MASQUERADE
          PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o $WAN_IF -j MASQUERADE

          [Peer]
          PublicKey = $CLIENT_PUBLIC
          AllowedIPs = 10.66.66.2/32
          EOF

          sudo chmod 600 /etc/wireguard/wg0.conf

          # --------------------------------------
          # Start WireGuard
          # --------------------------------------

          sudo wg-quick up wg0

          sleep 2

          echo "======================================"
          echo "WIREGUARD"
          echo "======================================"

          sudo wg show

          # --------------------------------------
          # Client config
          # --------------------------------------

          cat > "$WORKDIR/client.conf" <<EOF
          [Interface]
          PrivateKey = $CLIENT_PRIVATE
          Address = 10.66.66.2/24
          DNS = 1.1.1.1

          [Peer]
          PublicKey = $SERVER_PUBLIC
          Endpoint = $TS_IP:51820
          AllowedIPs = 0.0.0.0/0
          PersistentKeepalive = 25
          EOF

          chmod 600 "$WORKDIR/client.conf"

          # --------------------------------------
          # QR
          # --------------------------------------

          qrencode \
            -t PNG \
            -o "$WORKDIR/client-qr.png" \
            < "$WORKDIR/client.conf"

          echo "Client configuration created."

      # ==========================================
      # Create private website
      # ==========================================

      - name: Create client website
        shell: bash
        run: |
          set -e

          WORKDIR="$GITHUB_WORKSPACE/wireguard"

          CONFIG=$(python3 -c \
            'import json,sys; print(json.dumps(open(sys.argv[1]).read()))' \
            "$WORKDIR/client.conf")

          cat > "$WORKDIR/index.html" <<EOF
          <!DOCTYPE html>

          <html lang="en">

          <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width,initial-scale=1"
          >

          <title>WireGuard Client</title>

          <style>

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            padding: 30px;
            background: #111827;
            color: #f9fafb;
            font-family: Arial, sans-serif;
          }

          .container {
            max-width: 850px;
            margin: auto;
          }

          .card {
            background: #1f2937;
            padding: 25px;
            border-radius: 16px;
            margin-top: 20px;
          }

          textarea {
            width: 100%;
            min-height: 320px;
            resize: vertical;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #374151;
            background: #030712;
            color: #e5e7eb;
            font-family: monospace;
            font-size: 14px;
          }

          button {
            border: 0;
            border-radius: 10px;
            padding: 13px 20px;
            margin-top: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
          }

          #copy {
            background: #22c55e;
            color: #052e16;
          }

          #download {
            background: #374151;
            color: white;
            margin-left: 8px;
          }

          #status {
            color: #4ade80;
            margin-top: 12px;
            display: none;
          }

          .qr {
            text-align: center;
          }

          .qr img {
            max-width: 300px;
            background: white;
            padding: 15px;
            border-radius: 12px;
          }

          </style>

          </head>

          <body>

          <div class="container">

          <h1>WireGuard Client</h1>

          <p>
          Your WireGuard client configuration
          </p>

          <div class="card">

          <h2>Configuration</h2>

          <textarea id="config" readonly></textarea>

          <button id="copy" onclick="copyConfig()">
          Copy Config
          </button>

          <button id="download" onclick="downloadConfig()">
          Download .conf
          </button>

          <div id="status">
          ✓ Configuration copied
          </div>

          </div>

          <div class="card qr">

          <h2>QR Code</h2>

          <p>
          Scan with the WireGuard application
          </p>

          <img
            src="client-qr.png"
            alt="WireGuard QR Code"
          >

          </div>

          </div>

          <script>

          const config = $CONFIG;

          document.getElementById("config").value = config;

          async function copyConfig() {

            await navigator.clipboard.writeText(config);

            const status =
              document.getElementById("status");

            status.style.display = "block";

            setTimeout(() => {
              status.style.display = "none";
            }, 2000);

          }

          function downloadConfig() {

            const blob =
              new Blob(
                [config],
                {type: "text/plain"}
              );

            const url =
              URL.createObjectURL(blob);

            const a =
              document.createElement("a");

            a.href = url;
            a.download = "client.conf";

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(url);

          }

          </script>

          </body>

          </html>
          EOF

      # ==========================================
      # Start private web server
      # ==========================================

      - name: Start client website
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/wireguard"

          nohup python3 -m http.server 8080 \
            --bind 127.0.0.1 \
            > /tmp/wireguard-web.log 2>&1 &

          sleep 2

          tailscale serve --bg 8080

          echo
          echo "======================================"
          echo "WEBSITE"
          echo "======================================"

          tailscale serve status

      # ==========================================
      # Upload files as backup
      # ==========================================

      - name: Upload client package
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-client
          path: |
            wireguard/index.html
            wireguard/client.conf
            wireguard/client-qr.png
          retention-days: 1

      # ==========================================
      # Keep runner alive for 6 hours
      # ==========================================

      - name: Keep server alive for 6 hours
        run: |
          echo "======================================"
          echo "WIREGUARD SERVER IS RUNNING"
          echo "======================================"

          echo
          echo "Tailscale:"
          tailscale ip -4

          echo
          echo "WireGuard:"
          sudo wg show

          echo
          echo "Website:"
          tailscale serve status

          echo
          echo "Keeping runner alive for 6 hours..."
          echo

          sleep 21600

          echo "6 hours finished."
