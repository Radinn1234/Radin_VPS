name: WireGuard + Tailscale

on:
  workflow_dispatch:

jobs:
  wireguard:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Install dependencies
      # ==========================================

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            wireguard \
            qrencode \
            iptables \
            curl \
            python3

      # ==========================================
      # Install and connect Tailscale
      # ==========================================

      - name: Setup Tailscale
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          set -e

          if ! command -v tailscale >/dev/null 2>&1; then
            curl -fsSL https://tailscale.com/install.sh | sh
          fi

          sudo tailscale up \
            --auth-key="$TS_AUTHKEY"

          sleep 3

          echo "=========================================="
          echo "TAILSCALE STATUS"
          echo "=========================================="

          sudo tailscale status

          echo
          echo "=========================================="
          echo "TAILSCALE IP"
          echo "=========================================="

          TS_IP=$(sudo tailscale ip -4 | head -n1)

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale IPv4 not found."
            exit 1
          fi

          echo "$TS_IP" | tee "$GITHUB_WORKSPACE/tailscale-ip.txt"

          echo
          echo "Tailscale IP: $TS_IP"

      # ==========================================
      # Create WireGuard
      # ==========================================

      - name: Create WireGuard server
        shell: bash
        run: |
          set -e

          WORKDIR="$GITHUB_WORKSPACE/wireguard"

          mkdir -p "$WORKDIR"

          # ======================================
          # Generate server keys
          # ======================================

          wg genkey > "$WORKDIR/server_private.key"

          wg pubkey \
            < "$WORKDIR/server_private.key" \
            > "$WORKDIR/server_public.key"

          # ======================================
          # Generate client keys
          # ======================================

          wg genkey > "$WORKDIR/client_private.key"

          wg pubkey \
            < "$WORKDIR/client_private.key" \
            > "$WORKDIR/client_public.key"

          chmod 600 "$WORKDIR"/*.key

          SERVER_PRIVATE=$(cat "$WORKDIR/server_private.key")
          SERVER_PUBLIC=$(cat "$WORKDIR/server_public.key")

          CLIENT_PRIVATE=$(cat "$WORKDIR/client_private.key")
          CLIENT_PUBLIC=$(cat "$WORKDIR/client_public.key")

          # ======================================
          # Get Tailscale IP
          # ======================================

          TS_IP=$(cat "$GITHUB_WORKSPACE/tailscale-ip.txt")

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale IP is empty."
            exit 1
          fi

          echo "WireGuard Endpoint:"
          echo "$TS_IP:51820"

          # ======================================
          # Detect outgoing interface
          # ======================================

          WAN_IF=$(ip route show default | awk '/default/ {print $5; exit}')

          if [ -z "$WAN_IF" ]; then
            echo "ERROR: Could not detect WAN interface."
            exit 1
          fi

          echo "WAN interface: $WAN_IF"

          # ======================================
          # Enable IPv4 forwarding
          # ======================================

          sudo sysctl -w net.ipv4.ip_forward=1

          # ======================================
          # Create WireGuard directory
          # ======================================

          sudo mkdir -p /etc/wireguard

          # ======================================
          # WireGuard server config
          # ======================================

          sudo tee /etc/wireguard/wg0.conf > /dev/null <<EOF
          [Interface]
          Address = 10.66.66.1/24
          ListenPort = 51820
          PrivateKey = $SERVER_PRIVATE

          PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o $WAN_IF -j MASQUERADE
          PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o $WAN_IF -j MASQUERADE

          [Peer]
          PublicKey = $CLIENT_PUBLIC
          AllowedIPs = 10.66.66.2/32
          EOF

          sudo chmod 600 /etc/wireguard/wg0.conf

          # ======================================
          # Start WireGuard
          # ======================================

          sudo wg-quick up wg0

          sleep 3

          echo
          echo "=========================================="
          echo "WIREGUARD STATUS"
          echo "=========================================="

          sudo wg show

          # ======================================
          # Create client config
          # ======================================

          cat > "$WORKDIR/client.conf" <<EOF
          [Interface]
          PrivateKey = $CLIENT_PRIVATE
          Address = 10.66.66.2/24
          DNS = 1.1.1.1

          [Peer]
          PublicKey = $SERVER_PUBLIC
          Endpoint = $TS_IP:51820
          AllowedIPs = 0.0.0.0/0
          PersistentKeepalive = 25
          EOF

          chmod 600 "$WORKDIR/client.conf"

          echo
          echo "=========================================="
          echo "CLIENT CONFIG"
          echo "=========================================="

          cat "$WORKDIR/client.conf"

          # ======================================
          # Generate QR
          # ======================================

          qrencode \
            -t PNG \
            -o "$WORKDIR/client-qr.png" \
            < "$WORKDIR/client.conf"

          echo
          echo "QR generated."

      # ==========================================
      # Create HTML client page
      # ==========================================

      - name: Create client page
        shell: bash
        run: |
          set -e

          WORKDIR="$GITHUB_WORKSPACE/wireguard"

          CONFIG=$(python3 -c \
            'import json,sys; print(json.dumps(open(sys.argv[1]).read()))' \
            "$WORKDIR/client.conf")

          cat > "$WORKDIR/index.html" <<EOF
          <!DOCTYPE html>
          <html lang="en">

          <head>

          <meta charset="UTF-8">

          <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
          >

          <title>WireGuard Client</title>

          <style>

          * {
            box-sizing: border-box;
          }

          body {
            margin: 0;
            padding: 30px;
            background: #111827;
            color: #f9fafb;
            font-family: Arial, sans-serif;
          }

          .container {
            max-width: 850px;
            margin: auto;
          }

          .card {
            background: #1f2937;
            padding: 25px;
            border-radius: 16px;
            margin-top: 20px;
          }

          h1 {
            margin-bottom: 5px;
          }

          textarea {
            width: 100%;
            min-height: 320px;
            resize: vertical;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #374151;
            background: #030712;
            color: #e5e7eb;
            font-family: monospace;
            font-size: 14px;
          }

          button {
            border: 0;
            border-radius: 10px;
            padding: 13px 20px;
            margin-top: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
          }

          #copy {
            background: #22c55e;
            color: #052e16;
          }

          #download {
            background: #374151;
            color: white;
            margin-left: 8px;
          }

          #status {
            color: #4ade80;
            margin-top: 12px;
            display: none;
          }

          .qr {
            text-align: center;
          }

          .qr img {
            max-width: 300px;
            background: white;
            padding: 15px;
            border-radius: 12px;
          }

          </style>

          </head>

          <body>

          <div class="container">

          <h1>WireGuard Client</h1>

          <p>
          WireGuard client configuration
          </p>

          <div class="card">

          <h2>Client Config</h2>

          <textarea id="config" readonly></textarea>

          <br>

          <button id="copy" onclick="copyConfig()">
          Copy Config
          </button>

          <button id="download" onclick="downloadConfig()">
          Download .conf
          </button>

          <div id="status">
          ✓ Configuration copied
          </div>

          </div>

          <div class="card qr">

          <h2>QR Code</h2>

          <p>
          Scan this QR code using WireGuard
          </p>

          <img
            src="client-qr.png"
            alt="WireGuard QR Code"
          >

          </div>

          </div>

          <script>

          const config = $CONFIG;

          document.getElementById("config").value = config;

          async function copyConfig() {

            try {

              await navigator.clipboard.writeText(config);

              const status =
                document.getElementById("status");

              status.style.display = "block";

              setTimeout(() => {
                status.style.display = "none";
              }, 2000);

            } catch (error) {

              alert(
                "Copy failed. Please select the text manually."
              );

            }

          }

          function downloadConfig() {

            const blob = new Blob(
              [config],
              { type: "text/plain" }
            );

            const url =
              URL.createObjectURL(blob);

            const a =
              document.createElement("a");

            a.href = url;
            a.download = "client.conf";

            document.body.appendChild(a);

            a.click();

            a.remove();

            URL.revokeObjectURL(url);

          }

          </script>

          </body>

          </html>
          EOF

      # ==========================================
      # Create README
      # ==========================================

      - name: Create information file
        shell: bash
        run: |
          set -e

          TS_IP=$(cat "$GITHUB_WORKSPACE/tailscale-ip.txt")

          cat > "$GITHUB_WORKSPACE/wireguard/README.txt" <<EOF
          WireGuard Server
          =================

          Tailscale IP:
          $TS_IP

          WireGuard Endpoint:
          $TS_IP:51820

          WireGuard Network:
          10.66.66.0/24

          Client:
          10.66.66.2

          Files:
          - client.conf
          - client-qr.png
          - index.html

          IMPORTANT:
          This server is running on a temporary GitHub Actions runner.

          The server will disappear when the runner/job ends.
          EOF

      # ==========================================
      # Upload client package
      # ==========================================

      - name: Upload WireGuard client
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-client
          path: |
            wireguard/client.conf
            wireguard/client-qr.png
            wireguard/index.html
            wireguard/README.txt
          retention-days: 1

      # ==========================================
      # Display information
      # ==========================================

      - name: Show server information
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "WIREGUARD SERVER IS RUNNING"
          echo "=========================================="

          TS_IP=$(cat "$GITHUB_WORKSPACE/tailscale-ip.txt")

          echo
          echo "Tailscale IP:"
          echo "$TS_IP"

          echo
          echo "WireGuard Endpoint:"
          echo "$TS_IP:51820"

          echo
          echo "Client:"
          echo "10.66.66.2"

          echo
          echo "Artifact:"
          echo "wireguard-client"

          echo
          echo "The artifact contains:"
          echo "  - client.conf"
          echo "  - client-qr.png"
          echo "  - index.html"
          echo "  - README.txt"

      # ==========================================
      # Keep runner alive for 6 hours
      # ==========================================

      - name: Keep server alive for 6 hours
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "SERVER WILL STAY ONLINE FOR 6 HOURS"
          echo "=========================================="

          echo
          echo "21600 seconds remaining."

          sleep 21600

          echo
          echo "6 hours finished."
