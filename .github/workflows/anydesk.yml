name: Ubuntu GNOME + AnyDesk

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:

      # ----------------------------------------
      # Install packages
      # ----------------------------------------
      - name: Install GNOME and virtual display
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gnome \
            gnome-session \
            gnome-shell \
            dbus-x11 \
            xvfb \
            x11-xserver-utils \
            x11-utils

      # ----------------------------------------
      # Install AnyDesk
      # ----------------------------------------
      - name: Install AnyDesk
        run: |
          wget -qO- https://keys.anydesk.com/repos/DEB-GPG-KEY \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/anydesk.gpg

          echo "deb [signed-by=/usr/share/keyrings/anydesk.gpg] http://deb.anydesk.com/ all main" \
            | sudo tee /etc/apt/sources.list.d/anydesk.list

          sudo apt-get update
          sudo apt-get install -y anydesk

      # ----------------------------------------
      # Create desktop user
      # ----------------------------------------
      - name: Create desktop user
        run: |
          if ! id desktop >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash desktop
          fi

          echo "desktop:desktop" | sudo chpasswd

          sudo usermod -aG sudo desktop

      # ----------------------------------------
      # Start Xvfb
      # ----------------------------------------
      - name: Start virtual display
        run: |
          Xvfb :99 \
            -screen 0 1920x1080x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          echo $! > /tmp/xvfb.pid

          echo "DISPLAY=:99" >> "$GITHUB_ENV"

          sleep 3

          echo "=========================================="
          echo "Virtual display"
          echo "=========================================="

          echo "DISPLAY=$DISPLAY"

          xdpyinfo -display :99 | head -30

      # ----------------------------------------
      # Start GNOME
      # ----------------------------------------
      - name: Start GNOME
        run: |
          export DISPLAY=:99
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=GNOME
          export XDG_RUNTIME_DIR=/tmp/runtime-desktop

          sudo mkdir -p "$XDG_RUNTIME_DIR"
          sudo chown desktop:desktop "$XDG_RUNTIME_DIR"
          sudo chmod 700 "$XDG_RUNTIME_DIR"

          echo "Starting GNOME..."

          sudo -u desktop \
            env \
            DISPLAY=:99 \
            XDG_SESSION_TYPE=x11 \
            XDG_CURRENT_DESKTOP=GNOME \
            XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" \
            dbus-run-session -- \
            gnome-session \
            > /tmp/gnome.log 2>&1 &

          echo $! > /tmp/gnome.pid

          sleep 20

          echo ""
          echo "=========================================="
          echo "GNOME processes"
          echo "=========================================="

          ps aux | grep -Ei \
            'gnome-session|gnome-shell|mutter' \
            | grep -v grep || true

          echo ""
          echo "GNOME log:"
          tail -100 /tmp/gnome.log || true

      # ----------------------------------------
      # Start AnyDesk
      # ----------------------------------------
      - name: Start AnyDesk
        run: |
          sudo systemctl enable anydesk
          sudo systemctl restart anydesk

          sleep 10

          echo "=========================================="
          echo "AnyDesk service"
          echo "=========================================="

          sudo systemctl status anydesk --no-pager || true

          echo ""
          echo "AnyDesk processes:"

          ps aux | grep -i anydesk \
            | grep -v grep || true

      # ----------------------------------------
      # Check graphical environment
      # ----------------------------------------
      - name: Check graphical environment
        run: |
          export DISPLAY=:99

          echo "=========================================="
          echo "GRAPHICAL ENVIRONMENT"
          echo "=========================================="

          echo "DISPLAY=$DISPLAY"

          echo ""
          echo "X server:"
          xdpyinfo -display :99 | grep -E \
            'dimensions|depth|vendor name' || true

          echo ""
          echo "GNOME:"
          ps aux | grep -Ei \
            'gnome-session|gnome-shell|mutter' \
            | grep -v grep || true

          echo ""
          echo "AnyDesk:"
          ps aux | grep -i anydesk \
            | grep -v grep || true

      # ----------------------------------------
      # Get AnyDesk ID
      # ----------------------------------------
      - name: Get AnyDesk ID
        run: |
          echo "=========================================="
          echo "Getting AnyDesk ID"
          echo "=========================================="

          ID=""

          for i in {1..20}; do
            echo "Attempt $i..."

            ID=$(sudo anydesk --get-id 2>/dev/null || true)

            if [ -n "$ID" ]; then
              break
            fi

            sleep 3
          done

          if [ -n "$ID" ]; then

            echo ""
            echo "=========================================="
            echo "        ANYDESK CONNECTION INFO"
            echo "=========================================="
            echo ""
            echo "AnyDesk ID: $ID"
            echo ""
            echo "=========================================="

          else

            echo ""
            echo "WARNING: AnyDesk ID was not returned."
            echo ""

            echo "AnyDesk service:"
            sudo systemctl status anydesk --no-pager || true

            echo ""
            echo "AnyDesk processes:"
            ps aux | grep -i anydesk \
              | grep -v grep || true

          fi

      # ----------------------------------------
      # Keep runner alive
      # ----------------------------------------
      - name: Keep runner alive
        run: |
          echo ""
          echo "=========================================="
          echo "        DESKTOP IS RUNNING"
          echo "=========================================="
          echo ""
          echo "Display :99"
          echo "Resolution: 1920x1080"
          echo "Desktop: GNOME"
          echo "Remote: AnyDesk"
          echo ""

          while true; do
            echo "Runner alive: $(date)"
            sleep 60
          done
