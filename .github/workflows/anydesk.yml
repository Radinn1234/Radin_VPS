name: Ubuntu GNOME + AnyDesk

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Update system
        run: |
          sudo apt-get update

      - name: Install GNOME and Xorg
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ubuntu-desktop-minimal \
            gnome-session \
            gnome-shell \
            xorg \
            dbus-x11 \
            xvfb

      - name: Install AnyDesk
        run: |
          wget -qO- https://keys.anydesk.com/repos/DEB-GPG-KEY \
            | sudo gpg --dearmor -o /usr/share/keyrings/anydesk.gpg

          echo "deb [signed-by=/usr/share/keyrings/anydesk.gpg] http://deb.anydesk.com/ all main" \
            | sudo tee /etc/apt/sources.list.d/anydesk.list

          sudo apt-get update
          sudo apt-get install -y anydesk

      - name: Start AnyDesk service
        run: |
          sudo systemctl enable anydesk
          sudo systemctl restart anydesk

          sleep 10

          echo "===== AnyDesk Service ====="
          sudo systemctl status anydesk --no-pager || true

      - name: Get AnyDesk ID
        run: |
          echo "Waiting for AnyDesk..."

          for i in {1..12}; do
            echo "Attempt $i..."

            ID=$(anydesk --get-id 2>/dev/null || true)

            if [ -n "$ID" ]; then
              echo ""
              echo "=========================================="
              echo "          ANYDESK CONNECTION"
              echo "=========================================="
              echo "AnyDesk ID: $ID"
              echo "=========================================="
              echo ""

              break
            fi

            sleep 5
          done

          echo ""
          echo "AnyDesk processes:"
          ps aux | grep -i anydesk | grep -v grep || true

          echo ""
          echo "AnyDesk service:"
          sudo systemctl status anydesk --no-pager || true

      - name: Keep runner alive
        run: |
          echo "=========================================="
          echo "       RUNNER IS NOW ALIVE"
          echo "=========================================="
          echo ""

          while true; do
            echo "Runner alive: $(date)"
            sleep 60
          done
