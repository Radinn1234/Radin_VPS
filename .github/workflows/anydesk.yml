name: Ubuntu 24.04 GNOME + AnyDesk

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      - name: Install GNOME Desktop
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gnome \
            gnome-session \
            gnome-shell \
            gdm3 \
            xorg \
            dbus-x11

      - name: Disable Wayland
        run: |
          sudo mkdir -p /etc/gdm3

          sudo sed -i \
            's/^#WaylandEnable=false/WaylandEnable=false/' \
            /etc/gdm3/custom.conf

          if ! grep -q "^WaylandEnable=false" /etc/gdm3/custom.conf; then
            echo "WaylandEnable=false" | sudo tee -a /etc/gdm3/custom.conf
          fi

          echo "GDM configuration:"
          cat /etc/gdm3/custom.conf

      - name: Install AnyDesk
        run: |
          wget -qO- https://keys.anydesk.com/repos/DEB-GPG-KEY \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/anydesk.gpg

          echo "deb [signed-by=/usr/share/keyrings/anydesk.gpg] http://deb.anydesk.com/ all main" \
            | sudo tee /etc/apt/sources.list.d/anydesk.list

          sudo apt-get update
          sudo apt-get install -y anydesk

      - name: Configure Desktop User
        run: |
          if ! id desktop >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash desktop
          fi

          echo "desktop:desktop" | sudo chpasswd

          sudo usermod -aG sudo desktop

      - name: Configure X11 Session
        run: |
          sudo mkdir -p /etc/systemd/system/getty@tty1.service.d

          sudo tee /etc/systemd/system/getty@tty1.service.d/autologin.conf > /dev/null <<'EOF'
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin desktop --noclear %I $TERM
          EOF

          sudo systemctl daemon-reload

      - name: Start Xorg Session
        run: |
          sudo -u desktop bash -c '
            export DISPLAY=:0
            export XDG_SESSION_TYPE=x11
            export XDG_CURRENT_DESKTOP=GNOME
            export XDG_RUNTIME_DIR=/tmp/runtime-desktop

            mkdir -p "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"

            dbus-run-session -- gnome-session
          ' > /tmp/gnome.log 2>&1 &

          sleep 20

          echo "GNOME:"
          ps aux | grep -Ei \
            "gnome-session|gnome-shell|mutter" \
            | grep -v grep || true

      - name: Start AnyDesk
        run: |
          sudo systemctl enable anydesk
          sudo systemctl restart anydesk

          sleep 10

          sudo systemctl status anydesk --no-pager || true

          echo ""
          echo "AnyDesk:"
          ps aux | grep '[a]nydesk' || true

      - name: Get AnyDesk ID
        run: |
          ID=""

          for i in {1..20}; do
            echo "Attempt $i..."

            ID=$(sudo anydesk --get-id 2>/dev/null || true)

            if [ -n "$ID" ]; then
              break
            fi

            sleep 3
          done

          if [ -z "$ID" ]; then
            echo "Could not get AnyDesk ID."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "          ANYDESK CONNECTION"
          echo "=========================================="
          echo ""
          echo "AnyDesk ID: $ID"
          echo ""
          echo "=========================================="

      - name: Keep Desktop Alive
        run: |
          echo "Ubuntu 24.04 GNOME is running."
          echo "AnyDesk is running."

          while true; do
            echo "Desktop alive: $(date)"
            sleep 60
          done
