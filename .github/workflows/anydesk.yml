name: AnyDesk Windows Runner

on:
  workflow_dispatch:

jobs:
  anydesk:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:

      - name: Check Windows User
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "WINDOWS USER"
          Write-Host "=========================================="

          whoami

          Write-Host ""
          Write-Host "User SID:"
          whoami /user

          Write-Host ""
          Write-Host "Current user:"
          $env:USERNAME

          Write-Host ""
          Write-Host "Computer:"
          $env:COMPUTERNAME

      - name: Check AnyDesk Installation
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\AnyDesk\AnyDesk.exe",
            "C:\Program Files\AnyDesk\AnyDesk.exe"
          )

          $anydesk = $null

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $anydesk = $path
              break
            }
          }

          if ($null -eq $anydesk) {
            throw "AnyDesk.exe was not found."
          }

          Write-Host "AnyDesk:"
          Write-Host $anydesk

          Write-Host ""
          Write-Host "Version:"
          & $anydesk --version

      - name: Check AnyDesk Service
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "ANYDESK SERVICE"
          Write-Host "=========================================="

          Get-Service |
            Where-Object {
              $_.Name -like "*AnyDesk*" -or
              $_.DisplayName -like "*AnyDesk*"
            } |
            Format-Table Status, Name, DisplayName

          Write-Host ""
          Write-Host "AnyDesk processes:"

          Get-Process AnyDesk -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, Path |
            Format-Table -AutoSize

      - name: Get AnyDesk ID
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\AnyDesk\AnyDesk.exe",
            "C:\Program Files\AnyDesk\AnyDesk.exe"
          )

          $anydesk = $null

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $anydesk = $path
              break
            }
          }

          if ($null -eq $anydesk) {
            throw "AnyDesk.exe was not found."
          }

          Write-Host "=========================================="
          Write-Host "ANYDESK ID"
          Write-Host "=========================================="

          $id = ""

          for ($i = 1; $i -le 10; $i++) {

            Write-Host "Attempt $i..."

            $id = (& $anydesk --get-id 2>$null | Out-String).Trim()

            if (![string]::IsNullOrWhiteSpace($id)) {
              break
            }

            Start-Sleep -Seconds 2
          }

          if ([string]::IsNullOrWhiteSpace($id)) {
            throw "Could not get AnyDesk ID."
          }

          Write-Host ""
          Write-Host "AnyDesk ID:"
          Write-Host $id

      - name: Check Windows Interactive Sessions
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "WINDOWS SESSIONS"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "QUSER:"
          quser 2>&1

          Write-Host ""
          Write-Host "SESSION:"
          query session 2>&1

          Write-Host ""
          Write-Host "Current logged-on users:"
          Get-CimInstance Win32_LoggedOnUser |
            Select-Object -First 20 |
            Format-Table -AutoSize

      - name: Check Runner Account
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "RUNNER ACCOUNT"
          Write-Host "=========================================="

          $user = Get-LocalUser -Name "runner" -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            Write-Host "Local user 'runner' does not exist."
          }
          else {
            $user |
              Select-Object Name, Enabled, LastLogon, PasswordRequired |
              Format-List
          }

          Write-Host ""
          Write-Host "Administrators:"
          Get-LocalGroupMember -Group "Administrators" -ErrorAction SilentlyContinue |
            Format-Table Name, PrincipalSource, ObjectClass

      - name: Verify AnyDesk Password Secret
        shell: powershell
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          Write-Host "=========================================="
          Write-Host "ANYDESK PASSWORD SECRET"
          Write-Host "=========================================="

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw "ANYDESK_PASSWORD secret is missing."
          }

          Write-Host "ANYDESK_PASSWORD secret exists."
          Write-Host "Password itself will NOT be displayed."

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "RUNNER READY"
          Write-Host "=========================================="
          Write-Host "AnyDesk is running."
          Write-Host "Waiting for remote connection..."

          Start-Sleep -Seconds 300
