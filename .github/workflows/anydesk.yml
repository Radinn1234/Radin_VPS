name: Windows AnyDesk

on:
  workflow_dispatch:

jobs:
  anydesk:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Windows Information
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Windows Information"
          Write-Host "=========================================="

          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsBuildNumber |
            Format-List

      - name: Download AnyDesk
        shell: powershell
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $out = "$env:TEMP\AnyDesk.exe"

          Write-Host "Downloading AnyDesk..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $out `
            -UseBasicParsing

          if (!(Test-Path $out)) {
            throw "AnyDesk download failed."
          }

          Write-Host "Download completed."

      - name: Install AnyDesk
        shell: powershell
        run: |
          $exe = "$env:TEMP\AnyDesk.exe"
          $installDir = "C:\Program Files (x86)\AnyDesk"

          Write-Host "Installing AnyDesk..."

          Start-Process `
            -FilePath $exe `
            -ArgumentList "--install `"$installDir`" --start-with-win --silent" `
            -Wait `
            -NoNewWindow

          Start-Sleep -Seconds 10

          $anydesk = "$installDir\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {
            throw "AnyDesk installation failed."
          }

          Write-Host "AnyDesk installed successfully."
          Write-Host "Path: $anydesk"

      - name: Inspect AnyDesk
        shell: powershell
        run: |
          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          Write-Host "=========================================="
          Write-Host "AnyDesk Version"
          Write-Host "=========================================="

          & $anydesk --version

          Write-Host ""
          Write-Host "AnyDesk processes:"

          Get-Process AnyDesk -ErrorAction SilentlyContinue |
            Format-Table Id, ProcessName, Path

      - name: Start AnyDesk
        shell: powershell
        run: |
          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          Write-Host "Starting AnyDesk..."

          & $anydesk --start

          Start-Sleep -Seconds 10

          Write-Host "AnyDesk processes:"

          Get-Process AnyDesk -ErrorAction SilentlyContinue |
            Format-Table Id, ProcessName, Path

      - name: Configure Unattended Access
        shell: powershell
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw "ANYDESK_PASSWORD secret is missing."
          }

          Write-Host "=========================================="
          Write-Host "Configuring Unattended Access"
          Write-Host "=========================================="

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $anydesk
          $psi.Arguments = "--set-password _unattended_access"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true

          $process = New-Object System.Diagnostics.Process
          $process.StartInfo = $psi

          [void]$process.Start()

          $process.StandardInput.WriteLine($env:ANYDESK_PASSWORD)
          $process.StandardInput.Close()

          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()

          $process.WaitForExit()

          Write-Host "AnyDesk exit code: $($process.ExitCode)"

          if (![string]::IsNullOrWhiteSpace($stdout)) {
            Write-Host "AnyDesk output:"
            Write-Host $stdout
          }

          if (![string]::IsNullOrWhiteSpace($stderr)) {
            Write-Host "AnyDesk error output:"
            Write-Host $stderr
          }

          if ($process.ExitCode -ne 0) {
            throw "Failed to configure AnyDesk Unattended Access."
          }

          Write-Host "Unattended Access configured successfully."

      - name: Restart AnyDesk
        shell: powershell
        run: |
          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          Write-Host "Restarting AnyDesk service..."

          & $anydesk --restart-service

          Start-Sleep -Seconds 10

          Write-Host "AnyDesk processes:"

          Get-Process AnyDesk -ErrorAction SilentlyContinue |
            Format-Table Id, ProcessName, Path

      - name: Get AnyDesk ID
        shell: powershell
        run: |
          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          Write-Host "=========================================="
          Write-Host "Getting AnyDesk ID"
          Write-Host "=========================================="

          $id = ""

          for ($i = 1; $i -le 20; $i++) {
            Write-Host "Attempt $i..."

            $id = & $anydesk --get-id 2>$null |
              Out-String

            $id = $id.Trim()

            if (![string]::IsNullOrWhiteSpace($id)) {
              break
            }

            Start-Sleep -Seconds 3
          }

          if ([string]::IsNullOrWhiteSpace($id)) {
            Write-Host ""
            Write-Host "ERROR: Could not get AnyDesk ID."

            Write-Host ""
            Write-Host "AnyDesk processes:"

            Get-Process AnyDesk -ErrorAction SilentlyContinue |
              Format-Table Id, ProcessName, Path

            throw "AnyDesk ID was not available."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "ANYDESK ID: $id"
          Write-Host "=========================================="

      - name: Check AnyDesk Service
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "AnyDesk Services"
          Write-Host "=========================================="

          Get-Service |
            Where-Object {
              $_.Name -like "*AnyDesk*" -or
              $_.DisplayName -like "*AnyDesk*"
            } |
            Format-Table Status, Name, DisplayName

      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "AnyDesk is running."
          Write-Host "Runner will remain alive for 5 minutes."
          Write-Host "=========================================="

          Start-Sleep -Seconds 300
