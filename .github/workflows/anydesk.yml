name: Ubuntu GNOME + AnyDesk

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # Install GNOME + Xorg
      # ==========================================
      - name: Install GNOME and Xorg
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gnome \
            gnome-session \
            gnome-shell \
            xorg \
            dbus-x11 \
            x11-xserver-utils \
            x11-utils

      # ==========================================
      # Install AnyDesk
      # ==========================================
      - name: Install AnyDesk
        run: |
          wget -qO- https://keys.anydesk.com/repos/DEB-GPG-KEY \
            | sudo gpg --dearmor \
            -o /usr/share/keyrings/anydesk.gpg

          echo "deb [signed-by=/usr/share/keyrings/anydesk.gpg] http://deb.anydesk.com/ all main" \
            | sudo tee /etc/apt/sources.list.d/anydesk.list

          sudo apt-get update
          sudo apt-get install -y anydesk

      # ==========================================
      # Create desktop user
      # ==========================================
      - name: Create desktop user
        run: |
          if ! id desktop >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash desktop
          fi

          echo "desktop:desktop" | sudo chpasswd

          sudo usermod -aG sudo desktop

          sudo mkdir -p /run/user/$(id -u desktop)
          sudo chown desktop:desktop /run/user/$(id -u desktop)
          sudo chmod 700 /run/user/$(id -u desktop)

      # ==========================================
      # Start Xorg
      # ==========================================
      - name: Start Xorg
        run: |
          sudo Xorg :0 \
            -noreset \
            -nolisten tcp \
            -logfile /tmp/Xorg.0.log \
            > /tmp/xorg.stdout.log 2>&1 &

          echo $! > /tmp/xorg.pid

          echo "Waiting for Xorg..."

          for i in {1..20}; do
            if [ -S /tmp/.X11-unix/X0 ]; then
              echo "Xorg is ready."
              break
            fi

            sleep 1
          done

          echo ""
          echo "X11 socket:"
          ls -la /tmp/.X11-unix/ || true

          echo ""
          echo "Xorg process:"
          ps aux | grep '[X]org' || true

          echo ""
          echo "Xorg log:"
          tail -100 /tmp/Xorg.0.log || true

      # ==========================================
      # Allow desktop user to access X
      # ==========================================
      - name: Configure X11 access
        run: |
          sudo touch /tmp/.Xauthority
          sudo chown desktop:desktop /tmp/.Xauthority

          sudo -u desktop env \
            DISPLAY=:0 \
            XAUTHORITY=/tmp/.Xauthority \
            xhost +SI:localuser:desktop || true

      # ==========================================
      # Start GNOME on X11
      # ==========================================
      - name: Start GNOME
        run: |
          export DISPLAY=:0
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=GNOME
          export XDG_RUNTIME_DIR=/run/user/$(id -u desktop)

          echo "Starting GNOME on DISPLAY=$DISPLAY"

          sudo -u desktop \
            env \
            DISPLAY=:0 \
            XDG_SESSION_TYPE=x11 \
            XDG_CURRENT_DESKTOP=GNOME \
            XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" \
            dbus-run-session -- \
            gnome-session \
            > /tmp/gnome.log 2>&1 &

          echo $! > /tmp/gnome.pid

          sleep 20

          echo ""
          echo "GNOME processes:"
          ps aux | grep -Ei \
            'gnome-session|gnome-shell|mutter' \
            | grep -v grep || true

          echo ""
          echo "GNOME log:"
          tail -100 /tmp/gnome.log || true

      # ==========================================
      # Test X11
      # ==========================================
      - name: Test graphical display
        run: |
          export DISPLAY=:0

          echo "DISPLAY=$DISPLAY"

          echo ""
          echo "Display information:"
          xdpyinfo -display :0 | grep -E \
            'dimensions|depth|vendor name' || true

          echo ""
          echo "Root window:"
          xwininfo -root -display :0 || true

      # ==========================================
      # Start AnyDesk
      # ==========================================
      - name: Start AnyDesk
        run: |
          sudo systemctl enable anydesk
          sudo systemctl restart anydesk

          sleep 10

          echo "AnyDesk service:"
          sudo systemctl status anydesk --no-pager || true

          echo ""
          echo "AnyDesk processes:"
          ps aux | grep '[a]nydesk' || true

      # ==========================================
      # Get AnyDesk ID
      # ==========================================
      - name: Get AnyDesk ID
        run: |
          echo "=========================================="
          echo "Getting AnyDesk ID"
          echo "=========================================="

          ID=""

          for i in {1..20}; do
            echo "Attempt $i..."

            ID=$(sudo anydesk --get-id 2>/dev/null || true)

            if [ -n "$ID" ]; then
              break
            fi

            sleep 3
          done

          if [ -n "$ID" ]; then
            echo ""
            echo "=========================================="
            echo "       ANYDESK CONNECTION INFO"
            echo "=========================================="
            echo ""
            echo "AnyDesk ID: $ID"
            echo ""
            echo "=========================================="
          else
            echo ""
            echo "AnyDesk ID was not returned."
            echo ""

            sudo systemctl status anydesk --no-pager || true

            exit 1
          fi

      # ==========================================
      # Keep Runner alive
      # ==========================================
      - name: Keep runner alive
        run: |
          echo ""
          echo "=========================================="
          echo "       REMOTE DESKTOP IS RUNNING"
          echo "=========================================="
          echo ""
          echo "Desktop : GNOME"
          echo "Display : X11 :0"
          echo "Remote  : AnyDesk"
          echo ""

          while true; do
            echo "Runner alive: $(date)"
            sleep 60
          done
